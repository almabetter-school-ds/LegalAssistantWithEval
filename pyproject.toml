[project]
name = "legal-graphrag"
version = "0.1.0"
description = "PDF ingestion (OCR-aware, table-aware) + Neo4j GraphRAG + human-in-the-loop review for legal documents."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
